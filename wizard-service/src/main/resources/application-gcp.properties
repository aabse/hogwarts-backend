# Credentials and connection via environment variables (Kubernetes Secret / Secret Manager, see guide 05).
hogwarts.datasource.cloud-sql.username=${DB_USER:wizard_user}
hogwarts.datasource.cloud-sql.password=${DB_PASSWORD}
hogwarts.datasource.cloud-sql.db-name=wizard_db
hogwarts.datasource.cloud-sql.instance-connection-name=${INSTANCE_CONNECTION_NAME}

# Creates/updates the schema automatically from the JPA entities.
# Quick fix to unblock Postgres (unlike H2, it does not auto-create the schema);
# not recommended long term, see GKE_GCP_DEPLOYMENT/06_cloud_sql_database.md section 6.3 (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
