# Credenciales y conexión vía variables de entorno (Secret de Kubernetes / Secret Manager, ver guía 05).
hogwarts.datasource.cloud-sql.username=${DB_USER:duel_user}
hogwarts.datasource.cloud-sql.password=${DB_PASSWORD}
hogwarts.datasource.cloud-sql.db-name=duel_db
hogwarts.datasource.cloud-sql.instance-connection-name=${INSTANCE_CONNECTION_NAME}

# Genera/actualiza el esquema automáticamente a partir de las entidades JPA.
# Solución rápida para destrabar Postgres (que a diferencia de H2 no auto-crea el esquema);
# no recomendada a largo plazo, ver DESPLIEGUE_GKE_GCP/06_base_de_datos_cloud_sql.md sección 6.3 (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
