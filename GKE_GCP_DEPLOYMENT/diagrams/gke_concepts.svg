<svg viewBox="0 0 1000 610" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram of GKE concepts: a client calls the Service, which routes by selector to the Pods; those Pods run inside Nodes grouped in a Cluster; the Deployment creates and watches the replicas of those Pods.">
  <title>GKE concepts and how they relate</title>
  <desc>External client -> Service (LoadBalancer) -> Pods (inside Nodes, inside the Cluster). The Deployment manages the Pod replicas.</desc>

  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="610" fill="#ffffff"/>

  <!-- Client -->
  <rect x="40" y="30" width="200" height="70" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="140" y="56" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e293b">Client</text>
  <text x="140" y="74" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">curl / Postman</text>
  <text x="140" y="89" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">(outside the cluster)</text>

  <!-- Service -->
  <rect x="400" y="30" width="260" height="70" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="530" y="55" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#0c4a6e">Service: wizard-service</text>
  <text x="530" y="73" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0369a1">type: LoadBalancer</text>
  <text x="530" y="88" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0ea5e9">exposes an external public IP</text>

  <!-- Arrow client -> service -->
  <line x1="240" y1="65" x2="394" y2="65" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="317" y="57" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">HTTP :80</text>

  <!-- Cluster boundary -->
  <rect x="40" y="140" width="920" height="450" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="166" font-family="sans-serif" font-size="14" font-weight="700" fill="#475569">GKE Cluster</text>
  <text x="938" y="160" text-anchor="end" font-family="sans-serif" font-size="10.5" font-style="italic" fill="#94a3b8">Autopilot: Google creates the Nodes</text>
  <text x="938" y="174" text-anchor="end" font-family="sans-serif" font-size="10.5" font-style="italic" fill="#94a3b8">Standard: you manage them</text>

  <!-- Service -> Pods routing -->
  <polyline points="530,100 530,120 270,120 270,278" fill="none" stroke="#0369a1" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <polyline points="530,100 530,120 730,120 730,278" fill="none" stroke="#0369a1" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="530" y="113" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0369a1">selector: app=wizard-service</text>

  <!-- Node 1 -->
  <rect x="90" y="220" width="360" height="240" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="112" y="246" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#475569">Node 1 (VM)</text>

  <rect x="150" y="280" width="240" height="150" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="270" y="306" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#1e293b">Pod</text>
  <text x="270" y="323" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">app=wizard-service</text>
  <rect x="170" y="335" width="200" height="75" rx="4" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
  <text x="270" y="356" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#1e293b">container</text>
  <text x="270" y="372" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#334155">wizard-service:&lt;tag&gt;</text>
  <text x="270" y="387" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">port 8080</text>
  <text x="270" y="401" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">(Artifact Registry)</text>

  <!-- Node 2 -->
  <rect x="550" y="220" width="360" height="240" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="572" y="246" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#475569">Node 2 (VM)</text>

  <rect x="610" y="280" width="240" height="150" rx="6" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="730" y="306" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#1e293b">Pod</text>
  <text x="730" y="323" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">app=wizard-service</text>
  <rect x="630" y="335" width="200" height="75" rx="4" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
  <text x="730" y="356" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#1e293b">container</text>
  <text x="730" y="372" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#334155">wizard-service:&lt;tag&gt;</text>
  <text x="730" y="387" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">port 8080</text>
  <text x="730" y="401" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#64748b">(Artifact Registry)</text>

  <!-- Deployment -->
  <rect x="90" y="500" width="820" height="70" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="500" y="528" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#4c1d95">Deployment: wizard-service</text>
  <text x="500" y="546" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6d28d9">replicas: 2 · creates a ReplicaSet and coordinates rollouts</text>

  <!-- Deployment -> Pods management -->
  <line x1="270" y1="500" x2="270" y2="432" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowViolet)"/>
  <line x1="730" y1="500" x2="730" y2="432" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowViolet)"/>
  <text x="500" y="478" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#7c3aed">creates / replaces / watches replicas</text>
</svg>
